<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc" font-family="Inter, &#x27;Segoe UI&#x27;, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif"><title id="title">Figure 13.1 In one body, work is done in different ways</title><desc id="desc">Local clotting and neural regulation side by side: each starts, adjusts and limits itself differently.</desc><rect x="0" y="0" width="1200" height="900" rx="0" fill="#faf9f5"/><text x="48.0" y="44" font-size="19" fill="#206f7d" text-anchor="start">No View Is the Whole  /  Figure 13.1</text><text x="48.0" y="103" font-size="40" fill="#263b43" text-anchor="start">In one body, work is done in different ways</text><text x="48.0" y="144" font-size="22" fill="#5f7075" text-anchor="start">Local clotting and neural regulation side by side: each starts, adjusts and limits itself differently.</text><text x="70.0" y="215" font-size="26" fill="#ae5837" text-anchor="start" font-weight="500">Local stopping of bleeding</text><text x="440.0" y="215" font-size="26" fill="#206f7d" text-anchor="start" font-weight="500">Mutual regulation in neural activity</text><line x1="385" y1="235" x2="385" y2="680" stroke="#d5dedd" stroke-width="2"/><rect x="70" y="250" width="260" height="90" rx="8" fill="#f7ede5" stroke="#ae5837" stroke-width="2"/><text x="200.0" y="300" font-size="20" fill="#263b43" text-anchor="middle">Vessel injury</text><rect x="70" y="400" width="260" height="90" rx="8" fill="#f7ede5" stroke="#ae5837" stroke-width="2"/><text x="200.0" y="426" font-size="20" fill="#263b43" text-anchor="middle">Platelets, clotting</text><text x="200.0" y="450" font-size="20" fill="#263b43" text-anchor="middle">proteins and other</text><text x="200.0" y="474" font-size="20" fill="#263b43" text-anchor="middle">processes</text><rect x="70" y="550" width="260" height="90" rx="8" fill="#f7ede5" stroke="#ae5837" stroke-width="2"/><text x="200.0" y="588" font-size="20" fill="#263b43" text-anchor="middle">Take part in forming</text><text x="200.0" y="612" font-size="20" fill="#263b43" text-anchor="middle">a clot</text><path d="M 200 340 L 200 392" fill="none" stroke="#ae5837" stroke-width="3" stroke-linejoin="round"/><polygon points="200.00,392.00 205.00,380.00 195.00,380.00" fill="#ae5837"/><path d="M 200 490 L 200 542" fill="none" stroke="#ae5837" stroke-width="3" stroke-linejoin="round"/><polygon points="200.00,542.00 205.00,530.00 195.00,530.00" fill="#ae5837"/><text x="200.0" y="670" font-size="13" fill="#5f7075" text-anchor="middle">No conscious approval needed first</text><rect x="560" y="250" width="440" height="90" rx="8" fill="#edf4f3" stroke="#206f7d" stroke-width="2"/><text x="780.0" y="290.0" font-size="20" fill="#263b43" text-anchor="middle">Wider brain networks: sensation,</text><text x="780.0" y="314.0" font-size="20" fill="#263b43" text-anchor="middle">intention, learning</text><rect x="430" y="430" width="300" height="90" rx="8" fill="#edf4f3" stroke="#206f7d" stroke-width="2"/><text x="580.0" y="470.0" font-size="20" fill="#263b43" text-anchor="middle">Spinal cord, brainstem</text><text x="580.0" y="494.0" font-size="20" fill="#263b43" text-anchor="middle">and related circuits</text><rect x="830" y="430" width="260" height="90" rx="8" fill="#edf4f3" stroke="#206f7d" stroke-width="2"/><text x="960.0" y="470.0" font-size="20" fill="#263b43" text-anchor="middle">Movement or</text><text x="960.0" y="494.0" font-size="20" fill="#263b43" text-anchor="middle">protective response</text><rect x="575" y="600" width="420" height="80" rx="8" fill="#edf4f3" stroke="#206f7d" stroke-width="2"/><text x="785.0" y="635.0" font-size="20" fill="#263b43" text-anchor="middle">Sensory input from body and</text><text x="785.0" y="659.0" font-size="20" fill="#263b43" text-anchor="middle">environment</text><path d="M 640 345 L 585 425" fill="none" stroke="#206f7d" stroke-width="3" stroke-linejoin="round"/><polygon points="585.00,425.00 595.92,417.94 587.68,412.28" fill="#206f7d"/><polygon points="640.00,345.00 629.08,352.06 637.32,357.72" fill="#206f7d"/><text x="575.0" y="395" font-size="17" fill="#5f7075" text-anchor="end">can be modulated</text><path d="M 900 345 L 950 425" fill="none" stroke="#206f7d" stroke-width="3" stroke-linejoin="round"/><polygon points="950.00,425.00 947.88,412.17 939.40,417.47" fill="#206f7d"/><path d="M 735 475 L 825 475" fill="none" stroke="#206f7d" stroke-width="3" stroke-linejoin="round"/><polygon points="825.00,475.00 813.00,470.00 813.00,480.00" fill="#206f7d"/><path d="M 950 525 L 900 595" fill="none" stroke="#206f7d" stroke-width="3" stroke-linejoin="round"/><polygon points="900.00,595.00 911.04,588.14 902.91,582.33" fill="#206f7d"/><text x="985.0" y="570" font-size="17" fill="#5f7075" text-anchor="start">feedback</text><path d="M 650 595 L 600 525" fill="none" stroke="#206f7d" stroke-width="3" stroke-linejoin="round"/><polygon points="600.00,525.00 602.91,537.67 611.04,531.86" fill="#206f7d"/><path d="M 1000 640 L 1130 640 L 1130 295 L 1008 295" fill="none" stroke="#206f7d" stroke-width="3" stroke-linejoin="round"/><polygon points="1008.00,295.00 1020.00,300.00 1020.00,290.00" fill="#206f7d"/><line x1="70" y1="715" x2="1130" y2="715" stroke="#d5dedd" stroke-width="2"/><text x="70.0" y="760" font-size="24" fill="#ae5837" text-anchor="start" font-weight="500">External intervention</text><text x="340.0" y="760" font-size="17" fill="#263b43" text-anchor="start">Practice, tools, environment and drugs act on different processes by their own routes.</text><text x="48.0" y="865" font-size="20" fill="#5f7075" text-anchor="start">Functional relations only, not a complete neuroanatomy. Circuits and interventions differ in reach.</text></svg>