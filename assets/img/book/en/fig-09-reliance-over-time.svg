<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc" font-family="Inter, &#x27;Segoe UI&#x27;, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif"><title id="title">Figure 15.1 The answer has not changed; the conditions for relying on it have</title><desc id="desc">Two points at the same height: the answer is not yet worse, but the conditions for catching errors have moved.</desc><rect x="0" y="0" width="1200" height="800" rx="0" fill="#faf9f5"/><text x="48.0" y="44" font-size="19" fill="#206f7d" text-anchor="start">No View Is the Whole  /  Figure 15.1</text><text x="48.0" y="103" font-size="32" fill="#263b43" text-anchor="start">The answer has not changed; the conditions for relying on it have</text><text x="48.0" y="144" font-size="19" fill="#5f7075" text-anchor="start">Two points at the same height: the answer is not yet worse, but the conditions for catching errors have moved.</text><text x="1130.0" y="200" font-size="17" fill="#5f7075" text-anchor="end">Conceptual diagram, no measured scale</text><path d="M 190 640 L 190 200" fill="none" stroke="#263b43" stroke-width="2.5" stroke-linejoin="round"/><polygon points="190.00,200.00 185.00,212.00 195.00,212.00" fill="#263b43"/><path d="M 190 640 L 1140 640" fill="none" stroke="#263b43" stroke-width="2.5" stroke-linejoin="round"/><polygon points="1140.00,640.00 1128.00,635.00 1128.00,645.00" fill="#263b43"/><text x="150.0" y="215" font-size="17" fill="#5f7075" text-anchor="end">better</text><text x="150.0" y="645" font-size="17" fill="#5f7075" text-anchor="end">worse</text><text x="95" y="430" font-size="22" fill="#263b43" text-anchor="middle" transform="rotate(-90 95 430)">Current performance</text><text x="190.0" y="680" font-size="17" fill="#5f7075" text-anchor="middle">weaker</text><text x="1130.0" y="680" font-size="17" fill="#5f7075" text-anchor="middle">sounder</text><text x="665.0" y="722" font-size="22" fill="#263b43" text-anchor="middle">Conditions for recognising and handling important errors</text><line x1="200" y1="330" x2="1120" y2="330" stroke="#d5dedd" stroke-width="2" stroke-dasharray="6 6"/><path d="M 880 330 L 450 330" fill="none" stroke="#ae5837" stroke-width="3" stroke-linejoin="round"/><polygon points="450.00,330.00 462.00,335.00 462.00,325.00" fill="#ae5837"/><circle cx="410" cy="330" r="9" fill="#ae5837"/><circle cx="910" cy="330" r="9" fill="#206f7d"/><text x="410.0" y="290" font-size="21" fill="#ae5837" text-anchor="middle">After the data channels are weakened</text><text x="910.0" y="290" font-size="21" fill="#206f7d" text-anchor="middle">The original arrangement</text><text x="665.0" y="385" font-size="23" fill="#263b43" text-anchor="middle">The answer at this moment can be the same</text><rect x="400" y="460" width="560" height="110" rx="8" fill="#f7ede5" stroke="#ae5837" stroke-width="2"/><text x="680.0" y="505" font-size="15" fill="#263b43" text-anchor="middle">What is lost are the conditions for catching and correcting errors;</text><text x="680.0" y="535" font-size="18" fill="#263b43" text-anchor="middle">no claim is made that the next answer must be wrong.</text><text x="48.0" y="765" font-size="20" fill="#5f7075" text-anchor="start">Moving left means weaker conditions for checking and correction; it is not a prediction of the next error.</text></svg>