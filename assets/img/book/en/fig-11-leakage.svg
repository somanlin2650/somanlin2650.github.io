<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc" font-family="Inter, &#x27;Segoe UI&#x27;, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif"><title id="title">Figure 5.1 Hiding the detail does not cut the dependence</title><desc id="desc">The result of the same operation still depends on conditions that never appear on the interface.</desc><rect x="0" y="0" width="1200" height="800" rx="0" fill="#faf9f5"/><text x="48.0" y="44" font-size="19" fill="#206f7d" text-anchor="start">No View Is the Whole  /  Figure 5.1</text><text x="48.0" y="103" font-size="40" fill="#263b43" text-anchor="start">Hiding the detail does not cut the dependence</text><text x="48.0" y="144" font-size="22" fill="#5f7075" text-anchor="start">The result of the same operation still depends on conditions that never appear on the interface.</text><rect x="45" y="185" width="530" height="510" rx="18" fill="#ffffff" stroke="#94a7aa" stroke-width="2"/><text x="70.0" y="230" font-size="28" fill="#206f7d" text-anchor="start">Conditions as expected</text><rect x="75" y="260" width="470" height="100" rx="18" fill="#edf4f3"/><text x="97.0" y="301" font-size="27" fill="#206f7d" text-anchor="start" font-weight="500">Drag a file into a remote folder</text><path d="M 310 368 L 310 397" fill="none" stroke="#206f7d" stroke-width="3" stroke-linejoin="round"/><polygon points="310.00,397.00 315.00,385.00 305.00,385.00" fill="#206f7d"/><rect x="75" y="405" width="470" height="100" rx="18" fill="#edf4f3"/><text x="97.0" y="446" font-size="27" fill="#206f7d" text-anchor="start" font-weight="500">File transfer completes</text><rect x="75" y="585" width="470" height="82" rx="18" fill="#edf4f3"/><text x="97.0" y="626" font-size="18" fill="#206f7d" text-anchor="start" font-weight="500">Connection, storage and the rest are normal</text><path d="M 310 578 L 310 514" fill="none" stroke="#206f7d" stroke-width="3" stroke-linejoin="round"/><polygon points="310.00,514.00 305.00,526.00 315.00,526.00" fill="#206f7d"/><text x="325.0" y="554" font-size="21" fill="#5f7075" text-anchor="start">still shaping the result</text><rect x="625" y="185" width="530" height="510" rx="18" fill="#ffffff" stroke="#94a7aa" stroke-width="2"/><text x="650.0" y="230" font-size="28" fill="#ae5837" text-anchor="start">Conditions change</text><rect x="655" y="260" width="470" height="100" rx="18" fill="#edf4f3"/><text x="677.0" y="301" font-size="27" fill="#206f7d" text-anchor="start" font-weight="500">Drag a file into a remote folder</text><path d="M 890 368 L 890 397" fill="none" stroke="#ae5837" stroke-width="3" stroke-linejoin="round"/><polygon points="890.00,397.00 895.00,385.00 885.00,385.00" fill="#ae5837"/><rect x="655" y="405" width="470" height="100" rx="18" fill="#f7ede5"/><text x="677.0" y="446" font-size="27" fill="#ae5837" text-anchor="start" font-weight="500">Wait, or a failure is reported</text><rect x="655" y="585" width="470" height="82" rx="18" fill="#f7ede5"/><text x="677.0" y="626" font-size="26" fill="#ae5837" text-anchor="start" font-weight="500">Connection drops mid-transfer</text><path d="M 890 578 L 890 514" fill="none" stroke="#ae5837" stroke-width="3" stroke-linejoin="round"/><polygon points="890.00,514.00 885.00,526.00 895.00,526.00" fill="#ae5837"/><text x="905.0" y="554" font-size="21" fill="#5f7075" text-anchor="start">still shaping the result</text><text x="48.0" y="765" font-size="20" fill="#5f7075" text-anchor="start">The limit can appear on first use; the diagram assumes no slow accumulation over the years.</text></svg>