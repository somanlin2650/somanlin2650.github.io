<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860" role="img" aria-labelledby="title desc" font-family="Inter, &#x27;Segoe UI&#x27;, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif"><title id="title">Figure 9.1 One objection may rest on different reasons</title><desc id="desc">First find where the disagreement lies, then decide what material to gather.</desc><rect x="0" y="0" width="1200" height="860" rx="0" fill="#faf9f5"/><text x="48.0" y="44" font-size="19" fill="#206f7d" text-anchor="start">No View Is the Whole  /  Figure 9.1</text><text x="48.0" y="103" font-size="40" fill="#263b43" text-anchor="start">One objection may rest on different reasons</text><text x="48.0" y="144" font-size="22" fill="#5f7075" text-anchor="start">First find where the disagreement lies, then decide what material to gather.</text><rect x="325" y="187" width="550" height="102" rx="18" fill="#edf4f3"/><text x="347.0" y="228" font-size="21" fill="#206f7d" text-anchor="start" font-weight="500">Hypothetical proposal: more lighting in the</text><text x="347.0" y="255" font-size="21" fill="#206f7d" text-anchor="start" font-weight="500">park at night</text><path d="M 600 295 L 600 325 L 220 325 L 220 355" fill="none" stroke="#206f7d" stroke-width="3" stroke-linejoin="round"/><polygon points="220.00,355.00 225.00,343.00 215.00,343.00" fill="#206f7d"/><path d="M 600 325 L 600 355" fill="none" stroke="#206f7d" stroke-width="3" stroke-linejoin="round"/><polygon points="600.00,355.00 605.00,343.00 595.00,343.00" fill="#206f7d"/><path d="M 600 325 L 980 325 L 980 355" fill="none" stroke="#206f7d" stroke-width="3" stroke-linejoin="round"/><polygon points="980.00,355.00 985.00,343.00 975.00,343.00" fill="#206f7d"/><rect x="50" y="363" width="340" height="176" rx="18" fill="#edf4f3"/><text x="72.0" y="404" font-size="26" fill="#206f7d" text-anchor="start" font-weight="500">Effect of the lighting</text><text x="72.0" y="456" font-size="18" fill="#263b43" text-anchor="start">Do the lamps reach the paths</text><text x="72.0" y="483" font-size="18" fill="#263b43" text-anchor="start">where people fall?</text><text x="72.0" y="510" font-size="18" fill="#263b43" text-anchor="start">Does safety actually improve?</text><path d="M 220 547 L 220 595" fill="none" stroke="#206f7d" stroke-width="3" stroke-linejoin="round"/><polygon points="220.00,595.00 225.00,583.00 215.00,583.00" fill="#206f7d"/><rect x="50" y="603" width="340" height="148" rx="18" fill="#ffffff" stroke="#94a7aa" stroke-width="2"/><text x="72.0" y="644" font-size="24" fill="#206f7d" text-anchor="start" font-weight="500">Then look into</text><text x="72.0" y="691" font-size="15" fill="#263b43" text-anchor="start">Accident locations, lighting</text><text x="72.0" y="715" font-size="15" fill="#263b43" text-anchor="start">conditions</text><text x="72.0" y="739" font-size="15" fill="#263b43" text-anchor="start">and outcomes after the change</text><rect x="430" y="363" width="340" height="176" rx="18" fill="#edf4f3"/><text x="452.0" y="404" font-size="26" fill="#206f7d" text-anchor="start" font-weight="500">How costs compare</text><text x="452.0" y="461" font-size="23" fill="#263b43" text-anchor="start">Beyond easier passage,</text><text x="452.0" y="493" font-size="23" fill="#263b43" text-anchor="start">what happens to</text><text x="452.0" y="525" font-size="23" fill="#263b43" text-anchor="start">wildlife?</text><path d="M 600 547 L 600 595" fill="none" stroke="#206f7d" stroke-width="3" stroke-linejoin="round"/><polygon points="600.00,595.00 605.00,583.00 595.00,583.00" fill="#206f7d"/><rect x="430" y="603" width="340" height="148" rx="18" fill="#ffffff" stroke="#94a7aa" stroke-width="2"/><text x="452.0" y="644" font-size="25" fill="#206f7d" text-anchor="start" font-weight="500">Then look into</text><text x="452.0" y="696" font-size="19" fill="#263b43" text-anchor="start">Impact data, and the reasons</text><text x="452.0" y="724" font-size="19" fill="#263b43" text-anchor="start">given for weighing each cost</text><rect x="810" y="363" width="340" height="176" rx="18" fill="#edf4f3"/><text x="832.0" y="404" font-size="26" fill="#206f7d" text-anchor="start" font-weight="500">Who gets to decide</text><text x="832.0" y="457" font-size="19" fill="#263b43" text-anchor="start">Can nearby residents take</text><text x="832.0" y="485" font-size="19" fill="#263b43" text-anchor="start">part?</text><text x="832.0" y="513" font-size="19" fill="#263b43" text-anchor="start">Is the procedure appropriate?</text><path d="M 980 547 L 980 595" fill="none" stroke="#206f7d" stroke-width="3" stroke-linejoin="round"/><polygon points="980.00,595.00 985.00,583.00 975.00,583.00" fill="#206f7d"/><rect x="810" y="603" width="340" height="148" rx="18" fill="#ffffff" stroke="#94a7aa" stroke-width="2"/><text x="832.0" y="644" font-size="25" fill="#206f7d" text-anchor="start" font-weight="500">Then look into</text><text x="832.0" y="693" font-size="16" fill="#263b43" text-anchor="start">Authority, forms of participation</text><text x="832.0" y="718" font-size="16" fill="#263b43" text-anchor="start">and the response of those affected</text><text x="48.0" y="825" font-size="20" fill="#5f7075" text-anchor="start">Confirming one effect does not by itself settle every question of cost and procedure.</text></svg>