<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc" font-family="Inter, &#x27;Segoe UI&#x27;, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif"><title id="title">Figure 7.1 Both called triangles, in two different spaces</title><desc id="desc">Left: straight lines on a flat plane. Right: short arcs of great circles on an ideal sphere.</desc><rect x="0" y="0" width="1200" height="700" rx="0" fill="#faf9f5"/><text x="48.0" y="44" font-size="19" fill="#206f7d" text-anchor="start">No View Is the Whole  /  Figure 7.1</text><text x="48.0" y="103" font-size="40" fill="#263b43" text-anchor="start">Both called triangles, in two different spaces</text><text x="48.0" y="144" font-size="22" fill="#5f7075" text-anchor="start">Left: straight lines on a flat plane. Right: short arcs of great circles on an ideal sphere.</text><text x="300.0" y="215" font-size="26" fill="#263b43" text-anchor="middle">Euclidean plane</text><text x="890.0" y="215" font-size="26" fill="#263b43" text-anchor="middle">Ideal sphere</text><polygon points="160,560 440,560 160,280" fill="none" stroke="#206f7d" stroke-width="4" stroke-linejoin="round"/><polyline points="160,526 194,526 194,560" fill="none" stroke="#ae5837" stroke-width="2.5"/><text x="188.0" y="500" font-size="22" fill="#ae5837" text-anchor="start">90°</text><text x="185.0" y="340" font-size="22" fill="#ae5837" text-anchor="start">45°</text><text x="372.0" y="545" font-size="22" fill="#ae5837" text-anchor="start">45°</text><text x="300.0" y="620" font-size="21" fill="#263b43" text-anchor="middle">Straight lines as sides   |   angle sum 180°</text><circle cx="890" cy="430" r="135" fill="#eef2f2"/><path d="M 890 302 Q 790 360 775 470" fill="none" stroke="#206f7d" stroke-width="4"/><path d="M 890 302 Q 990 360 1005 470" fill="none" stroke="#206f7d" stroke-width="4"/><path d="M 775 470 Q 890 515 1005 470" fill="none" stroke="#206f7d" stroke-width="4"/><text x="890.0" y="278" font-size="20" fill="#ae5837" text-anchor="middle">North Pole</text><text x="890.0" y="258" font-size="20" fill="#ae5837" text-anchor="middle">90°</text><text x="748.0" y="478" font-size="20" fill="#ae5837" text-anchor="end">90°</text><text x="1032.0" y="478" font-size="20" fill="#ae5837" text-anchor="start">90°</text><text x="890.0" y="620" font-size="20" fill="#263b43" text-anchor="middle">Short arcs of great circles as sides   |   angle sum 270°</text><text x="48.0" y="665" font-size="20" fill="#5f7075" text-anchor="start">A mathematical construction, not a map. Two answers: 180° and 270°.</text></svg>