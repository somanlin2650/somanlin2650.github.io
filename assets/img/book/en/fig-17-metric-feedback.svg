<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="880" viewBox="0 0 1200 880" role="img" aria-labelledby="title desc" font-family="Inter, &#x27;Segoe UI&#x27;, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif"><title id="title">Figure 14.1 The measure starts changing the world it measures</title><desc id="desc">The number that hits the target and the thing you set out to improve need a route for checking each other.</desc><rect x="0" y="0" width="1200" height="880" rx="0" fill="#faf9f5"/><text x="48.0" y="44" font-size="19" fill="#206f7d" text-anchor="start">No View Is the Whole  /  Figure 14.1</text><text x="48.0" y="103" font-size="40" fill="#263b43" text-anchor="start">The measure starts changing the world it measures</text><text x="48.0" y="144" font-size="20" fill="#5f7075" text-anchor="start">The number that hits the target and the thing you set out to improve need a route for checking each other.</text><rect x="55" y="194" width="350" height="125" rx="18" fill="#edf4f3"/><text x="77.0" y="235" font-size="23" fill="#206f7d" text-anchor="start" font-weight="500">What was to be improved</text><text x="77.0" y="281" font-size="15" fill="#263b43" text-anchor="start">e.g. fewer rats</text><rect x="650" y="194" width="495" height="125" rx="18" fill="#edf4f3"/><text x="672.0" y="235" font-size="27" fill="#206f7d" text-anchor="start" font-weight="500">The chosen metric</text><text x="672.0" y="293" font-size="23" fill="#263b43" text-anchor="start">e.g. number of rat tails handed in</text><rect x="650" y="403" width="495" height="125" rx="18" fill="#edf4f3"/><text x="672.0" y="444" font-size="27" fill="#206f7d" text-anchor="start" font-weight="500">Rewards, evaluation, resources</text><text x="672.0" y="502" font-size="23" fill="#263b43" text-anchor="start">Make hitting the target a reason to act</text><rect x="650" y="630" width="495" height="125" rx="18" fill="#edf4f3"/><text x="672.0" y="671" font-size="26" fill="#206f7d" text-anchor="start" font-weight="500">Participants adjust what they do</text><text x="672.0" y="720" font-size="15" fill="#263b43" text-anchor="start">Improve the work, or only the countable part</text><rect x="55" y="630" width="350" height="125" rx="18" fill="#edf4f3"/><text x="77.0" y="671" font-size="22" fill="#206f7d" text-anchor="start" font-weight="500">New numbers and records</text><text x="77.0" y="716" font-size="15" fill="#263b43" text-anchor="start">Go back into the evaluation</text><rect x="55" y="403" width="350" height="150" rx="18" fill="#f7ede5"/><text x="77.0" y="444" font-size="20" fill="#ae5837" text-anchor="start" font-weight="500">Check real effects and costs</text><text x="77.0" y="487" font-size="15" fill="#263b43" text-anchor="start">Has the original problem improved?</text><text x="77.0" y="511" font-size="15" fill="#263b43" text-anchor="start">Who bears the uncounted</text><text x="77.0" y="535" font-size="15" fill="#263b43" text-anchor="start">consequences?</text><path d="M 413 243 L 642 243" fill="none" stroke="#206f7d" stroke-width="3" stroke-linejoin="round"/><polygon points="642.00,243.00 630.00,238.00 630.00,248.00" fill="#206f7d"/><text x="520.0" y="225" font-size="21" fill="#5f7075" text-anchor="middle">choose a measure</text><path d="M 897 327 L 897 395" fill="none" stroke="#206f7d" stroke-width="3" stroke-linejoin="round"/><polygon points="897.00,395.00 902.00,383.00 892.00,383.00" fill="#206f7d"/><path d="M 897 536 L 897 622" fill="none" stroke="#206f7d" stroke-width="3" stroke-linejoin="round"/><polygon points="897.00,622.00 902.00,610.00 892.00,610.00" fill="#206f7d"/><path d="M 642 702 L 413 702" fill="none" stroke="#206f7d" stroke-width="3" stroke-linejoin="round"/><polygon points="413.00,702.00 425.00,707.00 425.00,697.00" fill="#206f7d"/><path d="M 413 656 L 505 656 L 505 292 L 642 292" fill="none" stroke="#206f7d" stroke-width="3" stroke-linejoin="round"/><polygon points="642.00,292.00 630.00,287.00 630.00,297.00" fill="#206f7d"/><text x="515.0" y="383" font-size="21" fill="#206f7d" text-anchor="start">re-evaluate</text><rect x="499" y="470" width="12" height="14" rx="0" fill="#faf9f5"/><path d="M 642 667 L 573 667 L 573 477 L 413 477" fill="none" stroke="#ae5837" stroke-width="3" stroke-linejoin="round"/><polygon points="413.00,477.00 425.00,482.00 425.00,472.00" fill="#ae5837"/><path d="M 230 395 L 230 327" fill="none" stroke="#ae5837" stroke-width="3" stroke-linejoin="round"/><polygon points="230.00,327.00 225.00,339.00 235.00,339.00" fill="#ae5837"/><text x="48.0" y="845" font-size="18" fill="#5f7075" text-anchor="start">Teal: the evaluation loop. Brown: back to the purpose for checking. A change in behaviour is not the same as fraud.</text></svg>