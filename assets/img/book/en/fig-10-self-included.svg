<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="810" viewBox="0 0 1200 810" role="img" aria-labelledby="title desc" font-family="Inter, &#x27;Segoe UI&#x27;, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif"><title id="title">Figure 0.1 Ask the same questions of yourself</title><desc id="desc">What changes is the way of examining, not a demand that you and others share the same experience.</desc><rect x="0" y="0" width="1200" height="810" rx="0" fill="#faf9f5"/><text x="48.0" y="44" font-size="19" fill="#206f7d" text-anchor="start">No View Is the Whole  /  Figure 0.1</text><text x="48.0" y="103" font-size="40" fill="#263b43" text-anchor="start">Ask the same questions of yourself</text><text x="48.0" y="144" font-size="21" fill="#5f7075" text-anchor="start">What changes is the way of examining, not a demand that you and others share the same experience.</text><rect x="40" y="185" width="540" height="530" rx="18" fill="#ffffff" stroke="#94a7aa" stroke-width="2"/><rect x="620" y="185" width="540" height="530" rx="18" fill="#ffffff" stroke="#94a7aa" stroke-width="2"/><text x="70.0" y="230" font-size="26" fill="#ae5837" text-anchor="start">The self left outside the explanation</text><text x="650.0" y="230" font-size="24" fill="#206f7d" text-anchor="start">The self enters the shared examination</text><rect x="80" y="270" width="455" height="92" rx="18" fill="#edf4f3"/><text x="102.0" y="311" font-size="27" fill="#206f7d" text-anchor="start" font-weight="500">Other people&#x27;s judgements</text><path d="M 308 363 L 308 393" fill="none" stroke="#206f7d" stroke-width="3" stroke-linejoin="round"/><polygon points="308.00,393.00 313.00,381.00 303.00,381.00" fill="#206f7d"/><rect x="80" y="400" width="455" height="114" rx="18" fill="#edf4f3"/><text x="102.0" y="441" font-size="16" fill="#206f7d" text-anchor="start" font-weight="500">Ask them:</text><text x="102.0" y="480" font-size="15" fill="#263b43" text-anchor="start">How did experience, information and situation take</text><text x="102.0" y="504" font-size="15" fill="#263b43" text-anchor="start">part?</text><rect x="80" y="550" width="205" height="100" rx="18" fill="#f7ede5"/><text x="102.0" y="591" font-size="20" fill="#ae5837" text-anchor="start" font-weight="500">My own</text><text x="102.0" y="617" font-size="20" fill="#ae5837" text-anchor="start" font-weight="500">certainty</text><path d="M 290 600 L 329 600" fill="none" stroke="#ae5837" stroke-width="3" stroke-linejoin="round"/><polygon points="329.00,600.00 317.00,595.00 317.00,605.00" fill="#ae5837"/><rect x="340" y="550" width="195" height="100" rx="18" fill="#f7ede5"/><text x="362.0" y="591" font-size="19" fill="#ae5837" text-anchor="start" font-weight="500">Used directly</text><text x="362.0" y="616" font-size="19" fill="#ae5837" text-anchor="start" font-weight="500">as the measure</text><rect x="650" y="270" width="225" height="100" rx="18" fill="#edf4f3"/><text x="672.0" y="311" font-size="20" fill="#206f7d" text-anchor="start" font-weight="500">Others&#x27;</text><text x="672.0" y="337" font-size="20" fill="#206f7d" text-anchor="start" font-weight="500">judgements</text><rect x="905" y="270" width="225" height="100" rx="18" fill="#edf4f3"/><text x="927.0" y="311" font-size="22" fill="#206f7d" text-anchor="start" font-weight="500">My judgements</text><path d="M 763 375 L 763 400 L 890 400 L 890 428" fill="none" stroke="#206f7d" stroke-width="3" stroke-linejoin="round"/><polygon points="890.00,428.00 895.00,416.00 885.00,416.00" fill="#206f7d"/><path d="M 1018 375 L 1018 400 L 890 400" fill="none" stroke="#206f7d" stroke-width="3" stroke-linejoin="round"/><polygon points="890.00,400.00 902.00,405.00 902.00,395.00" fill="#206f7d"/><rect x="660" y="435" width="460" height="177" rx="18" fill="#edf4f3"/><text x="682.0" y="476" font-size="27" fill="#206f7d" text-anchor="start" font-weight="500">Both can be asked:</text><text x="682.0" y="526" font-size="15" fill="#263b43" text-anchor="start">What is it based on? Do the conditions still hold?</text><text x="682.0" y="550" font-size="15" fill="#263b43" text-anchor="start">What material could change it?</text><text x="682.0" y="574" font-size="15" fill="#263b43" text-anchor="start">Successes and errors both stay open to</text><text x="682.0" y="598" font-size="15" fill="#263b43" text-anchor="start">understanding.</text><text x="890.0" y="660" font-size="15" fill="#5f7075" text-anchor="middle">The standards used to check can themselves be reconsidered.</text><text x="48.0" y="775" font-size="20" fill="#5f7075" text-anchor="start">How a view was formed and whether its reasons hold are still two separate things to check.</text></svg>