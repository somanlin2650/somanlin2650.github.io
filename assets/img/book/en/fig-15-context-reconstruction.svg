<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="890" viewBox="0 0 1200 890" role="img" aria-labelledby="title desc" font-family="Inter, &#x27;Segoe UI&#x27;, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif"><title id="title">Figure 10.2 Readers must reconstruct, and must also check</title><desc id="desc">A background the text never states is not confirmed just because one explanation runs smoothly.</desc><rect x="0" y="0" width="1200" height="890" rx="0" fill="#faf9f5"/><text x="48.0" y="44" font-size="19" fill="#206f7d" text-anchor="start">No View Is the Whole  /  Figure 10.2</text><text x="48.0" y="103" font-size="40" fill="#263b43" text-anchor="start">Readers must reconstruct, and must also check</text><text x="48.0" y="144" font-size="22" fill="#5f7075" text-anchor="start">A background the text never states is not confirmed just because one explanation runs smoothly.</text><rect x="50" y="200" width="430" height="150" rx="18" fill="#edf4f3"/><text x="72.0" y="241" font-size="25" fill="#206f7d" text-anchor="start" font-weight="500">The author&#x27;s work at the time</text><text x="72.0" y="289" font-size="15" fill="#263b43" text-anchor="start">What question was being answered?</text><text x="72.0" y="313" font-size="15" fill="#263b43" text-anchor="start">What materials, word meanings and limits?</text><rect x="720" y="200" width="430" height="150" rx="18" fill="#edf4f3"/><text x="742.0" y="241" font-size="22" fill="#206f7d" text-anchor="start" font-weight="500">The background the reader brings</text><text x="742.0" y="286" font-size="15" fill="#263b43" text-anchor="start">Own experience, word meanings, expectations</text><text x="742.0" y="310" font-size="15" fill="#263b43" text-anchor="start">May help, may also mislead</text><path d="M 265 358 L 265 407" fill="none" stroke="#206f7d" stroke-width="3" stroke-linejoin="round"/><polygon points="265.00,407.00 270.00,395.00 260.00,395.00" fill="#206f7d"/><text x="290.0" y="392" font-size="21" fill="#5f7075" text-anchor="start">partly written down</text><path d="M 935 358 L 935 407" fill="none" stroke="#206f7d" stroke-width="3" stroke-linejoin="round"/><polygon points="935.00,407.00 940.00,395.00 930.00,395.00" fill="#206f7d"/><rect x="50" y="415" width="430" height="113" rx="18" fill="#ffffff" stroke="#94a7aa" stroke-width="2"/><text x="72.0" y="456" font-size="26" fill="#206f7d" text-anchor="start" font-weight="500">The text and images at hand</text><text x="72.0" y="505" font-size="15" fill="#263b43" text-anchor="start">First check what it actually says</text><rect x="720" y="415" width="430" height="113" rx="18" fill="#f7ede5"/><text x="742.0" y="456" font-size="26" fill="#ae5837" text-anchor="start" font-weight="500">A provisional reconstruction</text><text x="742.0" y="505" font-size="15" fill="#263b43" text-anchor="start">Guesses at question, conditions, inference</text><path d="M 488 472 L 712 472" fill="none" stroke="#206f7d" stroke-width="3" stroke-linejoin="round"/><polygon points="712.00,472.00 700.00,467.00 700.00,477.00" fill="#206f7d"/><text x="600.0" y="454" font-size="18" fill="#5f7075" text-anchor="middle">reading and conjecture</text><rect x="310" y="656" width="650" height="137" rx="18" fill="#edf4f3"/><text x="332.0" y="697" font-size="22" fill="#206f7d" text-anchor="start" font-weight="500">Let the reading be checked against outside material</text><text x="332.0" y="742" font-size="15" fill="#263b43" text-anchor="start">Context, background sources, questions, actual operation</text><text x="332.0" y="766" font-size="15" fill="#263b43" text-anchor="start">Check the original meaning, and whether it still holds when reused</text><path d="M 935 536 L 935 595 L 700 595 L 700 648" fill="none" stroke="#206f7d" stroke-width="3" stroke-linejoin="round"/><polygon points="700.00,648.00 705.00,636.00 695.00,636.00" fill="#206f7d"/><path d="M 265 536 L 265 725 L 302 725" fill="none" stroke="#94a7aa" stroke-width="3" stroke-linejoin="round"/><polygon points="302.00,725.00 290.00,720.00 290.00,730.00" fill="#94a7aa"/><path d="M 968 725 L 1172 725 L 1172 570 L 1040 570 L 1040 536" fill="none" stroke="#ae5837" stroke-width="3" stroke-linejoin="round"/><polygon points="1040.00,536.00 1035.00,548.00 1045.00,548.00" fill="#ae5837"/><text x="1090.0" y="631" font-size="23" fill="#ae5837" text-anchor="middle">revise</text><text x="48.0" y="855" font-size="18" fill="#5f7075" text-anchor="start">A reconstruction is an understanding that can be corrected, not a guarantee of recovering the author&#x27;s whole mind.</text></svg>