<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="815" viewBox="0 0 1200 815" role="img" aria-labelledby="title desc" font-family="Inter, &#x27;Segoe UI&#x27;, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif"><title id="title">Figure 5.2 Same average, a new question needs different answers</title><desc id="desc">Question: does this set of data contain any value below 20?</desc><rect x="0" y="0" width="1200" height="815" rx="0" fill="#faf9f5"/><text x="48.0" y="44" font-size="19" fill="#206f7d" text-anchor="start">No View Is the Whole  /  Figure 5.2</text><text x="48.0" y="103" font-size="38" fill="#263b43" text-anchor="start">Same average, a new question needs different answers</text><text x="48.0" y="144" font-size="22" fill="#5f7075" text-anchor="start">Question: does this set of data contain any value below 20?</text><rect x="115" y="200" width="400" height="134" rx="18" fill="#edf4f3"/><text x="137.0" y="241" font-size="27" fill="#206f7d" text-anchor="start" font-weight="500">Set A</text><text x="137.0" y="299" font-size="23" fill="#263b43" text-anchor="start">40 and 60</text><path d="M 315 340 L 315 376" fill="none" stroke="#206f7d" stroke-width="3" stroke-linejoin="round"/><polygon points="315.00,376.00 320.00,364.00 310.00,364.00" fill="#206f7d"/><rect x="115" y="385" width="400" height="85" rx="18" fill="#ffffff" stroke="#94a7aa" stroke-width="2"/><text x="137.0" y="426" font-size="30" fill="#206f7d" text-anchor="start" font-weight="500">Average: 50</text><rect x="115" y="635" width="400" height="90" rx="18" fill="#edf4f3"/><text x="137.0" y="676" font-size="23" fill="#206f7d" text-anchor="start" font-weight="500">Answer from the raw data: No</text><rect x="685" y="200" width="400" height="134" rx="18" fill="#f7ede5"/><text x="707.0" y="241" font-size="27" fill="#ae5837" text-anchor="start" font-weight="500">Set B</text><text x="707.0" y="299" font-size="23" fill="#263b43" text-anchor="start">0 and 100</text><path d="M 885 340 L 885 376" fill="none" stroke="#206f7d" stroke-width="3" stroke-linejoin="round"/><polygon points="885.00,376.00 890.00,364.00 880.00,364.00" fill="#206f7d"/><rect x="685" y="385" width="400" height="85" rx="18" fill="#ffffff" stroke="#94a7aa" stroke-width="2"/><text x="707.0" y="426" font-size="30" fill="#206f7d" text-anchor="start" font-weight="500">Average: 50</text><rect x="685" y="635" width="400" height="90" rx="18" fill="#f7ede5"/><text x="707.0" y="676" font-size="22" fill="#ae5837" text-anchor="start" font-weight="500">Answer from the raw data: Yes</text><text x="600.0" y="438" font-size="23" fill="#5f7075" text-anchor="middle">identical</text><rect x="115" y="512" width="970" height="77" rx="18" fill="#f7ede5"/><text x="600.0" y="561" font-size="29" fill="#ae5837" text-anchor="middle">With only &quot;average 50&quot; left, the question cannot be settled.</text><path d="M 102 260 L 62 260 L 62 682 L 108 682" fill="none" stroke="#206f7d" stroke-width="3" stroke-linejoin="round"/><polygon points="108.00,682.00 96.00,677.00 96.00,687.00" fill="#206f7d"/><path d="M 1098 260 L 1138 260 L 1138 682 L 1092 682" fill="none" stroke="#ae5837" stroke-width="3" stroke-linejoin="round"/><polygon points="1092.00,682.00 1104.00,687.00 1104.00,677.00" fill="#ae5837"/><text x="48.0" y="780" font-size="20" fill="#5f7075" text-anchor="start">The arrows run from raw data to answer; no valid inference runs from the average to the answer.</text></svg>