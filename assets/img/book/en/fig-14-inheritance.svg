<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc" font-family="Inter, &#x27;Segoe UI&#x27;, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif"><title id="title">Figure 10.1 Leave work that others can continue</title><desc id="desc">Stated reasons and shared practice each reduce a different difficulty in handing down.</desc><rect x="0" y="0" width="1200" height="900" rx="0" fill="#faf9f5"/><text x="48.0" y="44" font-size="19" fill="#206f7d" text-anchor="start">No View Is the Whole  /  Figure 10.1</text><text x="48.0" y="103" font-size="40" fill="#263b43" text-anchor="start">Leave work that others can continue</text><text x="48.0" y="144" font-size="22" fill="#5f7075" text-anchor="start">Stated reasons and shared practice each reduce a different difficulty in handing down.</text><text x="600.0" y="209" font-size="28" fill="#263b43" text-anchor="middle">One person&#x27;s understanding and skill</text><path d="M 600 226 L 600 247 L 295 247 L 295 273" fill="none" stroke="#206f7d" stroke-width="3" stroke-linejoin="round"/><polygon points="295.00,273.00 300.00,261.00 290.00,261.00" fill="#206f7d"/><path d="M 600 247 L 905 247 L 905 273" fill="none" stroke="#206f7d" stroke-width="3" stroke-linejoin="round"/><polygon points="905.00,273.00 910.00,261.00 900.00,261.00" fill="#206f7d"/><rect x="70" y="280" width="450" height="151" rx="18" fill="#edf4f3"/><text x="92.0" y="321" font-size="27" fill="#206f7d" text-anchor="start" font-weight="500">Spell out the relations</text><text x="92.0" y="373" font-size="17" fill="#263b43" text-anchor="start">Premises, reasons, steps and limits</text><text x="92.0" y="399" font-size="17" fill="#263b43" text-anchor="start">Easy to rerun, to locate disagreement, to cite</text><rect x="680" y="280" width="450" height="151" rx="18" fill="#edf4f3"/><text x="702.0" y="321" font-size="27" fill="#206f7d" text-anchor="start" font-weight="500">Work and practise together</text><text x="702.0" y="373" font-size="17" fill="#263b43" text-anchor="start">Demonstration, imitation, materials, feedback</text><text x="702.0" y="399" font-size="17" fill="#263b43" text-anchor="start">Carries differences hard to put fully into words</text><path d="M 527 355 L 673 355" fill="none" stroke="#94a7aa" stroke-width="3" stroke-linejoin="round"/><polygon points="673.00,355.00 661.00,350.00 661.00,360.00" fill="#94a7aa"/><polygon points="527.00,355.00 539.00,360.00 539.00,350.00" fill="#94a7aa"/><text x="600.0" y="338" font-size="12" fill="#5f7075" text-anchor="middle">complement each other</text><path d="M 295 440 L 295 475 L 600 475 L 600 505" fill="none" stroke="#206f7d" stroke-width="3" stroke-linejoin="round"/><polygon points="600.00,505.00 605.00,493.00 595.00,493.00" fill="#206f7d"/><path d="M 905 440 L 905 475 L 600 475" fill="none" stroke="#206f7d" stroke-width="3" stroke-linejoin="round"/><polygon points="600.00,475.00 612.00,480.00 612.00,470.00" fill="#206f7d"/><rect x="250" y="513" width="700" height="108" rx="18" fill="#edf4f3"/><text x="272.0" y="554" font-size="19" fill="#206f7d" text-anchor="start" font-weight="500">Those who come later: redo, ask, compare, connect to new cases</text><text x="272.0" y="596" font-size="15" fill="#263b43" text-anchor="start">What still holds? What needs changing?</text><path d="M 600 630 L 600 662 L 295 662 L 295 690" fill="none" stroke="#206f7d" stroke-width="3" stroke-linejoin="round"/><polygon points="295.00,690.00 300.00,678.00 290.00,678.00" fill="#206f7d"/><path d="M 600 662 L 905 662 L 905 690" fill="none" stroke="#206f7d" stroke-width="3" stroke-linejoin="round"/><polygon points="905.00,690.00 910.00,678.00 900.00,678.00" fill="#206f7d"/><rect x="70" y="698" width="450" height="109" rx="18" fill="#ffffff" stroke="#94a7aa" stroke-width="2"/><text x="92.0" y="739" font-size="26" fill="#206f7d" text-anchor="start" font-weight="500">Leave updated material</text><text x="92.0" y="789" font-size="16" fill="#263b43" text-anchor="start">Reasons, data, and the conditions where it failed</text><rect x="680" y="698" width="450" height="109" rx="18" fill="#ffffff" stroke="#94a7aa" stroke-width="2"/><text x="702.0" y="739" font-size="23" fill="#206f7d" text-anchor="start" font-weight="500">Keep an environment for learning</text><text x="702.0" y="785" font-size="15" fill="#263b43" text-anchor="start">Someone to demonstrate, someone able to object</text><text x="48.0" y="865" font-size="20" fill="#5f7075" text-anchor="start">The next group can carry on; errors travel too, and improvement still depends on actual checking.</text></svg>