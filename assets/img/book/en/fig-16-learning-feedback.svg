<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc" font-family="Inter, &#x27;Segoe UI&#x27;, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif"><title id="title">Figure 12.1 Feeling and reasoning can both improve through feedback</title><desc id="desc">Speed, input, reliability and how far each can be handed on need to be compared separately.</desc><rect x="0" y="0" width="1200" height="900" rx="0" fill="#faf9f5"/><text x="48.0" y="44" font-size="19" fill="#206f7d" text-anchor="start">No View Is the Whole  /  Figure 12.1</text><text x="48.0" y="103" font-size="36" fill="#263b43" text-anchor="start">Feeling and reasoning can both improve through feedback</text><text x="48.0" y="144" font-size="22" fill="#5f7075" text-anchor="start">Speed, input, reliability and how far each can be handed on need to be compared separately.</text><rect x="325" y="188" width="550" height="83" rx="18" fill="#edf4f3"/><text x="347.0" y="229" font-size="20" fill="#206f7d" text-anchor="start" font-weight="500">Experience, environment and available material</text><path d="M 600 280 L 600 304 L 295 304 L 295 335" fill="none" stroke="#206f7d" stroke-width="3" stroke-linejoin="round"/><polygon points="295.00,335.00 300.00,323.00 290.00,323.00" fill="#206f7d"/><path d="M 600 304 L 905 304 L 905 335" fill="none" stroke="#206f7d" stroke-width="3" stroke-linejoin="round"/><polygon points="905.00,335.00 910.00,323.00 900.00,323.00" fill="#206f7d"/><rect x="80" y="342" width="430" height="150" rx="18" fill="#edf4f3"/><text x="102.0" y="383" font-size="22" fill="#206f7d" text-anchor="start" font-weight="500">Perception, emotion, practised</text><text x="102.0" y="411" font-size="22" fill="#206f7d" text-anchor="start" font-weight="500">response</text><text x="102.0" y="456" font-size="15" fill="#263b43" text-anchor="start">May meet differences not yet put into words</text><text x="102.0" y="480" font-size="15" fill="#263b43" text-anchor="start">May also be swayed by irrelevant cues</text><rect x="690" y="342" width="430" height="150" rx="18" fill="#edf4f3"/><text x="712.0" y="383" font-size="25" fill="#206f7d" text-anchor="start" font-weight="500">Reasoning that can be stated</text><text x="712.0" y="431" font-size="15" fill="#263b43" text-anchor="start">Checks premises and relations separately</text><text x="712.0" y="455" font-size="15" fill="#263b43" text-anchor="start">May also miss material not yet obtained</text><path d="M 519 410 L 681 410" fill="none" stroke="#94a7aa" stroke-width="3" stroke-linejoin="round"/><polygon points="681.00,410.00 669.00,405.00 669.00,415.00" fill="#94a7aa"/><polygon points="519.00,410.00 531.00,415.00 531.00,405.00" fill="#94a7aa"/><text x="600.0" y="394" font-size="15" fill="#5f7075" text-anchor="middle">prompt and proofread</text><path d="M 295 500 L 295 530 L 600 530 L 600 558" fill="none" stroke="#206f7d" stroke-width="3" stroke-linejoin="round"/><polygon points="600.00,558.00 605.00,546.00 595.00,546.00" fill="#206f7d"/><path d="M 905 500 L 905 530 L 600 530" fill="none" stroke="#206f7d" stroke-width="3" stroke-linejoin="round"/><polygon points="600.00,530.00 612.00,535.00 612.00,525.00" fill="#206f7d"/><rect x="325" y="565" width="550" height="100" rx="18" fill="#ffffff" stroke="#94a7aa" stroke-width="2"/><text x="347.0" y="606" font-size="28" fill="#206f7d" text-anchor="start" font-weight="500">The present judgement and action</text><path d="M 600 674 L 600 705" fill="none" stroke="#206f7d" stroke-width="3" stroke-linejoin="round"/><polygon points="600.00,705.00 605.00,693.00 595.00,693.00" fill="#206f7d"/><rect x="240" y="713" width="720" height="110" rx="18" fill="#edf4f3"/><text x="262.0" y="754" font-size="24" fill="#206f7d" text-anchor="start" font-weight="500">Outcomes, comparison, or independent measurement</text><text x="262.0" y="801" font-size="15" fill="#263b43" text-anchor="start">Is the feedback relevant, complete, in time? Check that too.</text><path d="M 232 768 L 40 768 L 40 458 L 72 458" fill="none" stroke="#ae5837" stroke-width="3" stroke-linejoin="round"/><polygon points="72.00,458.00 60.00,453.00 60.00,463.00" fill="#ae5837"/><path d="M 968 768 L 1160 768 L 1160 458 L 1128 458" fill="none" stroke="#ae5837" stroke-width="3" stroke-linejoin="round"/><polygon points="1128.00,458.00 1140.00,463.00 1140.00,453.00" fill="#ae5837"/><text x="48.0" y="865" font-size="20" fill="#5f7075" text-anchor="start">The loop of learning and checking; action in the moment need not pass through every station first.</text></svg>