<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="840" viewBox="0 0 1200 840" role="img" aria-labelledby="title desc" font-family="Inter, &#x27;Segoe UI&#x27;, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif"><title id="title">Figure 15.2 Sometimes change the answer, sometimes rethink how to judge</title><desc id="desc">A shared method can allow different practices, and can accept new material that questions it.</desc><rect x="0" y="0" width="1200" height="840" rx="0" fill="#faf9f5"/><text x="48.0" y="44" font-size="19" fill="#206f7d" text-anchor="start">No View Is the Whole  /  Figure 15.2</text><text x="48.0" y="103" font-size="33" fill="#263b43" text-anchor="start">Sometimes change the answer, sometimes rethink how to judge</text><text x="48.0" y="144" font-size="22" fill="#5f7075" text-anchor="start">A shared method can allow different practices, and can accept new material that questions it.</text><rect x="70" y="189" width="1060" height="120" rx="18" fill="#edf4f3"/><text x="92.0" y="230" font-size="28" fill="#206f7d" text-anchor="start" font-weight="500">The original purpose and standards of evaluation</text><text x="92.0" y="289" font-size="23" fill="#263b43" text-anchor="start">What is to be done? What evidence is enough? Which costs are acceptable?</text><rect x="70" y="365" width="1060" height="280" rx="18" fill="#ffffff" stroke="#94a7aa" stroke-width="2"/><text x="98.0" y="404" font-size="14" fill="#5f7075" text-anchor="start">The work at hand</text><rect x="105" y="440" width="280" height="107" rx="18" fill="#edf4f3"/><text x="127.0" y="481" font-size="22" fill="#206f7d" text-anchor="start" font-weight="500">Identify the problem</text><text x="127.0" y="526" font-size="15" fill="#263b43" text-anchor="start">What is still missing?</text><rect x="460" y="440" width="280" height="107" rx="18" fill="#edf4f3"/><text x="482.0" y="481" font-size="26" fill="#206f7d" text-anchor="start" font-weight="500">Choose a method</text><text x="482.0" y="530" font-size="15" fill="#263b43" text-anchor="start">Borrow, practise or analyse</text><rect x="815" y="440" width="280" height="107" rx="18" fill="#edf4f3"/><text x="837.0" y="481" font-size="26" fill="#206f7d" text-anchor="start" font-weight="500">Action and result</text><text x="837.0" y="530" font-size="15" fill="#263b43" text-anchor="start">What happened?</text><path d="M 393 492 L 452 492" fill="none" stroke="#206f7d" stroke-width="3" stroke-linejoin="round"/><polygon points="452.00,492.00 440.00,487.00 440.00,497.00" fill="#206f7d"/><path d="M 748 492 L 807 492" fill="none" stroke="#206f7d" stroke-width="3" stroke-linejoin="round"/><polygon points="807.00,492.00 795.00,487.00 795.00,497.00" fill="#206f7d"/><path d="M 245 317 L 245 432" fill="none" stroke="#206f7d" stroke-width="3" stroke-linejoin="round"/><polygon points="245.00,432.00 250.00,420.00 240.00,420.00" fill="#206f7d"/><path d="M 955 555 L 955 599 L 600 599 L 600 555" fill="none" stroke="#206f7d" stroke-width="3" stroke-linejoin="round"/><polygon points="600.00,555.00 595.00,567.00 605.00,567.00" fill="#206f7d"/><text x="778.0" y="625" font-size="21" fill="#206f7d" text-anchor="middle">adjust this attempt</text><path d="M 1103 489 L 1162 489 L 1162 249 L 1138 249" fill="none" stroke="#ae5837" stroke-width="3" stroke-linejoin="round"/><polygon points="1138.00,249.00 1150.00,254.00 1150.00,244.00" fill="#ae5837"/><rect x="110" y="691" width="980" height="62" rx="18" fill="#f7ede5"/><text x="600.0" y="732" font-size="21" fill="#ae5837" text-anchor="middle">Unexpected material may also call for the purpose and standards to be reconsidered.</text><text x="48.0" y="805" font-size="20" fill="#5f7075" text-anchor="start">Reflection has its own time and cost; the outer loop need not be walked in full every time.</text></svg>