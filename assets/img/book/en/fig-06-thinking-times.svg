<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc" font-family="Inter, &#x27;Segoe UI&#x27;, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif"><title id="title">Figure 11.1 Put different kinds of work back in their own time</title><desc id="desc">Acting now, checking afterwards and learning over the long run make different demands on thinking.</desc><rect x="0" y="0" width="1200" height="820" rx="0" fill="#faf9f5"/><text x="48.0" y="44" font-size="19" fill="#206f7d" text-anchor="start">No View Is the Whole  /  Figure 11.1</text><text x="48.0" y="103" font-size="40" fill="#263b43" text-anchor="start">Put different kinds of work back in their own time</text><text x="48.0" y="144" font-size="21" fill="#5f7075" text-anchor="start">Acting now, checking afterwards and learning over the long run make different demands on thinking.</text><text x="70.0" y="310" font-size="25" fill="#206f7d" text-anchor="start" font-weight="500">In the moment</text><text x="300.0" y="270" font-size="22" fill="#263b43" text-anchor="start">Respond, operate, notice anomalies</text><line x1="290" y1="300" x2="900" y2="300" stroke="#206f7d" stroke-width="4"/><circle cx="290" cy="300" r="6" fill="#206f7d"/><circle cx="900" cy="300" r="6" fill="#206f7d"/><text x="300.0" y="340" font-size="19" fill="#5f7075" text-anchor="start">Existing skill and procedure</text><text x="70.0" y="470" font-size="27" fill="#ae5837" text-anchor="start" font-weight="500">Afterwards</text><text x="300.0" y="430" font-size="22" fill="#263b43" text-anchor="start">Check results, choose adjustments</text><line x1="290" y1="460" x2="900" y2="460" stroke="#ae5837" stroke-width="4"/><circle cx="290" cy="460" r="6" fill="#ae5837"/><circle cx="900" cy="460" r="6" fill="#ae5837"/><text x="300.0" y="500" font-size="19" fill="#5f7075" text-anchor="start">Complete a bounded judgement</text><text x="70.0" y="630" font-size="27" fill="#206f7d" text-anchor="start" font-weight="500">Long term</text><text x="300.0" y="590" font-size="22" fill="#263b43" text-anchor="start">Add methods, practise repeatedly</text><line x1="290" y1="620" x2="900" y2="620" stroke="#206f7d" stroke-width="4"/><circle cx="290" cy="620" r="6" fill="#206f7d"/><circle cx="900" cy="620" r="6" fill="#206f7d"/><text x="300.0" y="660" font-size="19" fill="#5f7075" text-anchor="start">Change what is available next time</text><path d="M 950 300 L 950 440" fill="none" stroke="#ae5837" stroke-width="2.5" stroke-linejoin="round"/><polygon points="950.00,440.00 955.00,428.00 945.00,428.00" fill="#ae5837"/><text x="970.0" y="375" font-size="19" fill="#5f7075" text-anchor="start">leaves results</text><path d="M 950 470 L 950 600" fill="none" stroke="#ae5837" stroke-width="2.5" stroke-linejoin="round"/><polygon points="950.00,600.00 955.00,588.00 945.00,588.00" fill="#ae5837"/><text x="970.0" y="540" font-size="16" fill="#5f7075" text-anchor="start">picks out the learning gap</text><path d="M 60 660 L 60 340" fill="none" stroke="#206f7d" stroke-width="2.5" stroke-linejoin="round"/><polygon points="60.00,340.00 55.00,352.00 65.00,352.00" fill="#206f7d"/><text x="300.0" y="730" font-size="16" fill="#263b43" text-anchor="start">Training and the arrangement of the environment carry the gains back into the next moment.</text><text x="48.0" y="785" font-size="20" fill="#5f7075" text-anchor="start">The segments are not drawn to any time scale; people need not follow one schedule.</text></svg>