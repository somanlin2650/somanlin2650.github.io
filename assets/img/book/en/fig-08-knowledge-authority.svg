<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc" font-family="Inter, &#x27;Segoe UI&#x27;, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif"><title id="title">Figure 14.2 Can the one who knows the problem change anything?</title><desc id="desc">Left: the information arrives, action still stalls. Right: the exception has a route to a decision.</desc><rect x="0" y="0" width="1200" height="780" rx="0" fill="#faf9f5"/><text x="48.0" y="44" font-size="19" fill="#206f7d" text-anchor="start">No View Is the Whole  /  Figure 14.2</text><text x="48.0" y="103" font-size="38" fill="#263b43" text-anchor="start">Can the one who knows the problem change anything?</text><text x="48.0" y="144" font-size="22" fill="#5f7075" text-anchor="start">Left: the information arrives, action still stalls. Right: the exception has a route to a decision.</text><line x1="600" y1="190" x2="600" y2="690" stroke="#d5dedd" stroke-width="2"/><text x="305.0" y="215" font-size="24" fill="#263b43" text-anchor="middle">Information present, action stuck</text><text x="900.0" y="215" font-size="24" fill="#263b43" text-anchor="middle">A reachable route for the exception</text><rect x="60" y="255" width="200" height="80" rx="8" fill="#edf4f3" stroke="#206f7d" stroke-width="2"/><text x="160.0" y="302.0" font-size="19" fill="#263b43" text-anchor="middle">Frontline worker</text><rect x="340" y="255" width="200" height="80" rx="8" fill="#edf4f3" stroke="#206f7d" stroke-width="2"/><text x="440.0" y="302.0" font-size="19" fill="#263b43" text-anchor="middle">Existing reports</text><rect x="340" y="470" width="230" height="80" rx="8" fill="#edf4f3" stroke="#206f7d" stroke-width="2"/><text x="455.0" y="506.0" font-size="19" fill="#263b43" text-anchor="middle">Person with</text><text x="455.0" y="528.0" font-size="19" fill="#263b43" text-anchor="middle">authority to decide</text><path d="M 265 295 L 335 295" fill="none" stroke="#206f7d" stroke-width="3" stroke-linejoin="round"/><polygon points="335.00,295.00 323.00,290.00 323.00,300.00" fill="#206f7d"/><path d="M 450 340 L 455 465" fill="none" stroke="#206f7d" stroke-width="3" stroke-linejoin="round"/><polygon points="455.00,465.00 459.52,452.81 449.52,453.21" fill="#206f7d"/><text x="115.0" y="385" font-size="19" fill="#ae5837" text-anchor="start">new exception</text><path d="M 160 400 L 200 440 M 200 400 L 160 440" stroke="#ae5837" stroke-width="3" fill="none"/><text x="100.0" y="480" font-size="17" fill="#ae5837" text-anchor="start">material outside the categories</text><text x="100.0" y="502" font-size="17" fill="#ae5837" text-anchor="start">never reaches the decision</text><text x="330.0" y="620" font-size="18" fill="#263b43" text-anchor="middle">Asking for more candour, without changing the channel</text><rect x="660" y="255" width="200" height="80" rx="8" fill="#edf4f3" stroke="#206f7d" stroke-width="2"/><text x="760.0" y="302.0" font-size="19" fill="#263b43" text-anchor="middle">Frontline worker</text><rect x="940" y="255" width="200" height="80" rx="8" fill="#edf4f3" stroke="#206f7d" stroke-width="2"/><text x="1040.0" y="302.0" font-size="19" fill="#263b43" text-anchor="middle">Existing reports</text><rect x="940" y="470" width="230" height="80" rx="8" fill="#edf4f3" stroke="#206f7d" stroke-width="2"/><text x="1055.0" y="506.0" font-size="19" fill="#263b43" text-anchor="middle">Person with</text><text x="1055.0" y="528.0" font-size="19" fill="#263b43" text-anchor="middle">authority to decide</text><path d="M 865 295 L 935 295" fill="none" stroke="#206f7d" stroke-width="3" stroke-linejoin="round"/><polygon points="935.00,295.00 923.00,290.00 923.00,300.00" fill="#206f7d"/><path d="M 1050 340 L 1055 465" fill="none" stroke="#206f7d" stroke-width="3" stroke-linejoin="round"/><polygon points="1055.00,465.00 1059.52,452.81 1049.52,453.21" fill="#206f7d"/><path d="M 770 340 L 990 465" fill="none" stroke="#ae5837" stroke-width="3" stroke-line