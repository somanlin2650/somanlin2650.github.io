- date: 2026-09-23
  zh-TW:
    title: 我為什麼遵守一套可以修改的道德
    description: 我願意接受社會教給我的規矩，卻不把它們當成永遠不能改的答案。從一件垃圾、一個誤判，到如何面對自己的反感，完整展開一種讓習慣與反思共同工作的道德觀。
    categories:
    - 哲學
    - 二階框架的應用
    tags:
    - 道德
    - 實用主義
    - 習慣
    - 反思
    - 所見非全貌
    url: /posts/a-morality-we-can-revise/
  en:
    title: Why I Follow a Morality I Can Revise
    description: I am willing to follow rules learned from society without treating them as final answers. From
      a piece of litter and a mistaken accusation to an examination of aversion, this essay develops a morality
      in which habit and reflection work together.
    categories:
    - Philosophy
    - Applying the Second-Order Framework
    tags:
    - Morality
    - Pragmatism
    - Habit
    - Reflection
    - No View Is the Whole
    url: /en/posts/a-morality-we-can-revise/

- date: 2026-08-25
  zh-TW:
    title: "當系統看不見自己正在缺氧：從 AI Agent、自動化到制度設計"
    url: /posts/when-ai-cannot-see-its-own-hypoxia/
    description: "Agent 不該取代自動化，但把 Agent 放在自動化上方也還不夠。真正成熟的系統，必須能發現自己的感測盲點，並把安全外化成獨立監督、權限分離與制度。"
    categories: [AI, 系統設計]
    tags: [AI Agent, Automation, 控制系統, AI 治理]
  en:
    title: "When a System Cannot See Its Own Hypoxia: From AI Agents and Automation to Institutional Design"
    url: /en/posts/when-ai-cannot-see-its-own-hypoxia/
    description: "An Agent should not replace automation—but placing an Agent above automation is still not enough. A mature system must be able to discover its own blind spots and externalize safety into independent oversight, separation of authority, and institutions."
    categories: [AI, System Design]
    tags: [AI Agent, Automation, Control Systems, AI Governance]

