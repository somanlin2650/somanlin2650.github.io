<script src="{{ '/assets/js/site-language.js' | relative_url }}"></script>
<script>
(function () {
  var alternate = {{ page.alternate_url | default: '' | jsonify }};
  if (!alternate || !window.SiteLanguage) return;
  var url = new URL(location.href);
  var explicit = /^(zh|en)(?:-|$)/i.test(url.searchParams.get('lang') || '');
  var desired = explicit ? SiteLanguage.resolve() : null;
  /* Consume legacy language parameters, keeping unrelated queries and hashes. */
  if (url.searchParams.has('lang')) {
    url.searchParams.delete('lang');
    history.replaceState(history.state, '', url.pathname + url.search + url.hash);
  }
  var current = {{ page.lang | default: site.lang | jsonify }};
  current = /^en\b/i.test(current) ? 'en' : 'zh';
  /* Auto-detect only a fresh homepage entry. Internal links keep their language. */
  var internal = document.referrer && new URL(document.referrer).origin === location.origin;
  if (!explicit && (location.pathname !== '/' || internal)) return;
  desired = desired || SiteLanguage.resolve();
  if (desired === current) return;
  var target = new URL(alternate, location.origin);
  target.search = url.search;
  target.hash = url.hash;
  /* Carry an explicit choice across the redirect even when storage is blocked.
     The destination consumes this parameter immediately. */
  if (explicit) target.searchParams.set('lang', desired);
  if (target.pathname !== location.pathname) location.replace(target.href);
}());
</script>

<!-- 繁體中文網頁字型：思源宋體 TC（內文）／思源黑體 TC（介面與標題）／Source Serif 4（西文） -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;700&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap"
>

{% if page.alternate_url %}
  {% if page.url == '/' or page.url == '/en/' %}
    <link rel="alternate" hreflang="x-default" href="{{ '/' | absolute_url }}">
  {% endif %}
  {% if page.lang == 'en' %}
    <link rel="alternate" hreflang="zh-Hant" href="{{ page.alternate_url | absolute_url }}">
    <link rel="alternate" hreflang="en" href="{{ page.url | absolute_url }}">
  {% else %}
    <link rel="alternate" hreflang="zh-Hant" href="{{ page.url | absolute_url }}">
    <link rel="alternate" hreflang="en" href="{{ page.alternate_url | absolute_url }}">
  {% endif %}
{% endif %}

<style>
#topbar .site-lang-compact {
  display: inline-flex; margin-left: auto; padding: .25rem .5rem;
  color: var(--text-muted-color); font-size: .8rem; font-weight: 600;
  text-decoration: none;
}
/* 錨點落下來的位置要跟 tocbot 判定「已經讀到這一節」的門檻一致，否則點了目錄
   之後，文章摘要會把上一節當成目前位置：桌機那一份的 headingsOffset 是 32，
   手機彈出目錄是 48，兩者都再加 10 的寬限。手機另有一條 48px 的黏著目錄列要讓開。 */
.content h2[id], .content h3[id], .content h4[id] { scroll-margin-top: 2rem; }
@media (max-width: 1199px) {
  .content h2[id], .content h3[id], .content h4[id] { scroll-margin-top: 3.5rem; }
}
</style>

<script>
document.addEventListener("DOMContentLoaded", function () {
  var isEn = /^en\b/i.test(document.documentElement.lang || "");
  var fallback = isEn ? "/" : "/en/";
  var alternate = {{ page.alternate_url | default: '' | jsonify }} || fallback;

  /* 全書那兩篇的標題帶著固定編號（part1 / s4 / s4-1），中英兩篇一致，
     所以換語言時可以把目前讀到的位置一起帶過去。其他頁面的標題 id 由
     kramdown 依標題文字產生，兩種語言對不起來，就不加錨點。 */
  var STABLE_ID = /^(part\d+|s\d+(-\d+)?)$/;

  function currentAnchor() {
    var headings = document.querySelectorAll(".content h2[id], .content h3[id], .content h4[id]");
    var found = "";
    for (var i = 0; i < headings.length; i++) {
      if (!STABLE_ID.test(headings[i].id)) continue;
      if (headings[i].getBoundingClientRect().top > 120) break;
      found = headings[i].id;
    }
    return found;
  }

  function remember(event) {
    var link = event.currentTarget;
    var target = link.getAttribute("data-site-lang");
    if (window.SiteLanguage) SiteLanguage.remember(target);
    var base = link.getAttribute("data-href-base");
    if (base) {
      var anchor = currentAnchor();
      link.href = anchor ? base + "#" + anchor : base;
      /* A transient choice is needed only when neither storage is writable.
         The destination removes it before displaying the page. */
      if (new URL(link.href).pathname === '/' && window.SiteLanguage && SiteLanguage.resolve() !== target) {
        var fallbackUrl = new URL(link.href);
        fallbackUrl.searchParams.set('lang', target);
        link.href = fallbackUrl.href;
      }
    }
  }

  function languageLink(label, lang, href, active, existing) {
    var a = existing || document.createElement("a");
    a.textContent = label;
    var explicit = new URL(href, location.origin);
    explicit.search = location.search;
    explicit.searchParams.delete("lang");
    a.href = explicit.pathname + explicit.search;
    a.setAttribute("data-href-base", explicit.pathname + explicit.search);
    a.setAttribute("data-site-lang", lang);
    a.setAttribute("lang", lang === "zh" ? "zh-Hant" : "en");
    a.setAttribute("hreflang", lang === "zh" ? "zh-Hant" : "en");
    if (active) a.setAttribute("aria-current", "true");
    a.addEventListener("click", remember);
    return a;
  }

  /* 帶錨點進來時直接定位。主題把 scroll-behavior 設成 smooth，換語言的落點常在
     兩萬像素以外，平滑捲動要滑很久；全書又有十八張圖，圖載入完成前瀏覽器
     算出的位置也可能不準，所以自己在載入後再定位一次。使用者已經自己捲過
     就不要再把他拉回去。 */
  var landing = location.hash.slice(1);
  if (landing && STABLE_ID.test(landing)) {
    var moved = false;
    ["wheel", "touchstart", "keydown"].forEach(function (type) {
      window.addEventListener(type, function () { moved = true; }, { passive: true, once: true });
    });

    var land = function () {
      var el = document.getElementById(landing);
      if (!el) return;
      var root = document.documentElement;
      var previous = root.style.scrollBehavior;
      root.style.scrollBehavior = "auto";
      el.scrollIntoView();
      root.style.scrollBehavior = previous;
    };

    land();
    window.addEventListener("load", function () {
      if (!moved) requestAnimationFrame(land);
    });
  }

  var searchTrigger = document.getElementById("search-trigger");
  if (searchTrigger) {
    /* Reuse the crawlable translation link instead of showing a third switch.
       Without JavaScript it remains in the document as a working fallback. */
    var translation = document.querySelector("nav.translation-link");
    var existing = translation && translation.querySelector("a");
    var compact = languageLink(isEn ? "中" : "EN", isEn ? "zh" : "en", alternate, false, existing);
    compact.className = "site-lang-compact";
    compact.setAttribute("aria-label", isEn ? "切換成中文" : "Switch to English");
    searchTrigger.parentNode.insertBefore(compact, searchTrigger);
    if (translation && !translation.children.length) translation.remove();
  }

  var homeUrl = isEn ? "/en/" : "/";
  [document.getElementById("avatar"), document.querySelector("#sidebar .site-title")]
    .forEach(function (link) { if (link) link.href = homeUrl; });

  document.querySelectorAll("#sidebar nav li.nav-item").forEach(function (item, index) {
    var link = item.querySelector("a");
    if (!link) return;
    if (index === 0) {
      link.href = homeUrl;
      return;
    }
    var path = new URL(link.href, window.location.origin).pathname;
    item.hidden = isEn ? !path.startsWith("/en/") : path.startsWith("/en/");
  });

  if (isEn) {
    document.querySelectorAll("#breadcrumb a[href='/']").forEach(function (link) {
      link.href = "/en/";
    });
  }
});
</script>
